<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Diaper Collection | My Points</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="points">
  <header class="topbar">
    <div class="brand-sm">Diaper Collection</div>
    <nav class="topnav">
      <a href="awareness.html" class="btn light">Back</a>
      <button id="logoutBtn" class="btn">Logout</button>
    </nav>
  </header>

  <main class="container card center">
    <h2>My Points</h2>
    <div class="points-box">
      <div class="points-value" id="pointsValue">0</div>
      <div class="points-note">You earn 5 points for every 10 diapers.</div>
      <div class="points-note small">Remainder (not yet redeemed): <span id="pendingValue">0</span></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
